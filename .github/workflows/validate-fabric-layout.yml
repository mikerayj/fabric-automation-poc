name: Validate Fabric layout

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sample Fabric assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Validate Fabric item metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          def fail(message):
              print(f"::error::{message}", file=sys.stderr)
              sys.exit(1)

          fabric_root = Path("fabric")
          if not fabric_root.is_dir():
              fail("Missing fabric/ directory")

          platform_files = sorted(fabric_root.rglob(".platform"))
          if not platform_files:
              fail("No Fabric item metadata files found under fabric/")

          for platform_path in platform_files:
              try:
                  platform = json.loads(platform_path.read_text(encoding="utf-8"))
              except json.JSONDecodeError as error:
                  fail(f"Invalid JSON in {platform_path}: {error}")

              metadata = platform.get("metadata", {})
              item_type = metadata.get("type")
              if not item_type:
                  fail(f"Missing metadata.type in {platform_path}")
              if not metadata.get("displayName"):
                  fail(f"Missing metadata.displayName in {platform_path}")

              if item_type == "Notebook":
                  notebook_sources = [
                      path for path in platform_path.parent.glob("notebook-content.*")
                      if path.is_file()
                  ]
                  if not notebook_sources:
                      fail(f"Missing notebook-content.* in {platform_path.parent}")
          PY
