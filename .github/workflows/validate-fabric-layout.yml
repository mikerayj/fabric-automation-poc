name: Validate Fabric layout

on:
  pull_request:
  push:
  workflow_dispatch:

jobs:
  validate:
    name: Validate sample Fabric assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Validate Fabric item metadata
        shell: bash
        run: |
          set -euo pipefail

          test -d fabric
          test -f fabric/HelloWorld.Notebook/.platform
          test -f fabric/HelloWorld.Notebook/notebook-content.py

          python - <<'PY'
          import json
          from pathlib import Path

          fabric_root = Path("fabric")
          item_dirs = [path for path in fabric_root.iterdir() if path.is_dir() and "." in path.name]
          if not item_dirs:
              raise SystemExit("No Fabric item folders found under fabric/")

          for item_dir in item_dirs:
              platform_path = item_dir / ".platform"
              if not platform_path.is_file():
                  raise SystemExit(f"Missing .platform metadata in {item_dir}")

              platform = json.loads(platform_path.read_text())
              metadata = platform.get("metadata", {})
              if not metadata.get("type"):
                  raise SystemExit(f"Missing metadata.type in {platform_path}")
              if not metadata.get("displayName"):
                  raise SystemExit(f"Missing metadata.displayName in {platform_path}")

          notebook_source = Path("fabric/HelloWorld.Notebook/notebook-content.py").read_text()
          if "Hello, Microsoft Fabric!" not in notebook_source:
              raise SystemExit("HelloWorld notebook does not contain the expected sample message")
          PY
