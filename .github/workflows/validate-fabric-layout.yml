name: Validate Fabric layout

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sample Fabric assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Validate Fabric item metadata
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          errors = []

          def report_error(message):
              errors.append(message)
              print(f"::error::{message}", file=sys.stderr)

          fabric_root = Path("fabric")
          if not fabric_root.is_dir():
              report_error("Missing fabric/ directory")
          else:
              platform_files = sorted(fabric_root.rglob(".platform"))
              if not platform_files:
                  report_error("No Fabric item metadata files found under fabric/")

              for platform_path in platform_files:
                  try:
                      platform = json.loads(platform_path.read_text(encoding="utf-8"))
                  except json.JSONDecodeError as error:
                      report_error(f"Invalid JSON in {platform_path}: {error}")
                      continue

                  if not isinstance(platform, dict):
                      report_error(f"Expected JSON object in {platform_path}")
                      continue

                  metadata = platform.get("metadata", {})
                  if not isinstance(metadata, dict):
                      report_error(f"Expected metadata object in {platform_path}")
                      continue

                  item_dir = platform_path.parent
                  item_suffix = item_dir.name.rsplit(".", 1)[-1] if "." in item_dir.name else None
                  item_type = metadata.get("type")
                  if not item_type:
                      report_error(f"Missing metadata.type in {platform_path}")
                  if not metadata.get("displayName"):
                      report_error(f"Missing metadata.displayName in {platform_path}")

                  if item_type == "Notebook" or item_suffix == "Notebook":
                      notebook_sources = [
                          path for path in item_dir.glob("notebook-content.*")
                          if path.is_file()
                      ]
                      if not notebook_sources:
                          report_error(f"Missing notebook-content.* in {item_dir}")

          if errors:
              sys.exit(1)
          PY

  deploy-dev:
    name: Deploy to dev
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name != 'pull_request'
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      FABRIC_DEV_WORKSPACE_ID: ${{ vars.FABRIC_DEV_WORKSPACE_ID }}
      FAB_SPN_CLIENT_ID: ${{ secrets.FAB_SPN_CLIENT_ID }}
      FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fabric CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ms-fabric-cli
          fab --version

      - name: Validate deployment settings
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${FABRIC_DEV_WORKSPACE_ID:-}" ]]; then
            echo "::error::Set the FABRIC_DEV_WORKSPACE_ID GitHub Actions variable to the existing dev Fabric workspace ID."
            exit 1
          fi

          if [[ -z "${FAB_SPN_CLIENT_ID:-}" ]]; then
            echo "::error::Set the FAB_SPN_CLIENT_ID GitHub Actions secret to the Entra application/client ID used for GitHub workload identity federation."
            exit 1
          fi

          if [[ -z "${FAB_TENANT_ID:-}" ]]; then
            echo "::error::Set the FAB_TENANT_ID GitHub Actions secret to your Entra tenant ID."
            exit 1
          fi

      - name: Authenticate Fabric CLI with GitHub OIDC
        shell: bash
        run: |
          set -euo pipefail

          fab config set encryption_fallback_enabled true

          export FAB_SPN_FEDERATED_TOKEN="$(
            curl --fail-with-body \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api://AzureADTokenExchange" \
              | jq -r '.value'
          )"

          if [[ -z "${FAB_SPN_FEDERATED_TOKEN}" ||
                "${FAB_SPN_FEDERATED_TOKEN}" == "null" ]]; then
            echo "::error::Failed to acquire a GitHub OIDC federated token."
            exit 1
          fi

          fab auth login \
            --tenant "${FAB_TENANT_ID}" \
            --username "${FAB_SPN_CLIENT_ID}" \
            --federated-token "${FAB_SPN_FEDERATED_TOKEN}"

          fab auth status

      - name: Validate dev workspace exists
        shell: bash
        run: |
          set -euo pipefail
          fab api -X get "workspaces/${FABRIC_DEV_WORKSPACE_ID}" --output_format json

      - name: Deploy notebooks to dev workspace
        shell: bash
        run: |
          set -euo pipefail

          cat > fabric-deploy.dev.yml <<EOF
          core:
            workspace_id: "${FABRIC_DEV_WORKSPACE_ID}"
            repository_directory: "fabric"
            item_types_in_scope:
              - Notebook
          unpublish:
            skip:
              dev: true
          EOF

          fab deploy --config fabric-deploy.dev.yml --target_env dev --force
