name: Validate Fabric layout

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate sample Fabric assets
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4.2.2

      - name: Validate Fabric item metadata
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          fabric_root = Path("fabric")
          if not fabric_root.is_dir():
              raise SystemExit("Missing fabric/ directory")

          platform_files = sorted(fabric_root.rglob(".platform"))
          if not platform_files:
              raise SystemExit("No Fabric item metadata files found under fabric/")

          notebook_count = 0
          for platform_path in platform_files:
              platform = json.loads(platform_path.read_text())
              metadata = platform.get("metadata", {})
              item_type = metadata.get("type")
              if not item_type:
                  raise SystemExit(f"Missing metadata.type in {platform_path}")
              if not metadata.get("displayName"):
                  raise SystemExit(f"Missing metadata.displayName in {platform_path}")

              if item_type == "Notebook":
                  notebook_count += 1
                  notebook_path = platform_path.parent / "notebook-content.py"
                  if not notebook_path.is_file():
                      raise SystemExit(f"Missing {notebook_path}")

          if notebook_count == 0:
              raise SystemExit("No Fabric notebook items found under fabric/")
          PY
